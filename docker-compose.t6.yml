version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ztreel6_postgres_prod
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: ztreel
    ports:
      - "5436:5432"
    volumes:
      - ztreel6_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ztreel6_net

  redis:
    image: redis:7
    container_name: ztreel6_redis_prod
    ports:
      - "6386:6379"
    volumes:
      - ztreel6_redis_data:/data
    restart: unless-stopped
    networks:
      - ztreel6_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ztreel6_api_prod
    ports:
      - "3006:3000"
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: "postgresql://root:rootpassword@postgres:5432/ztreel?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      PORT: 3000
      JWT_SECRET: "ZTREEL_SECRET_KEY_2026"
      RENDER_CONCURRENCY: 1
      NODE_ENV: "production"
    volumes:
      - ztreel6_storage:/usr/src/app/apps/api/storage
      - ztreel6_uploads:/usr/src/app/apps/api/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - ztreel6_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ztreel6_web_prod
    ports:
      - "8086:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ztreel6_net

volumes:
  ztreel6_postgres_data:
  ztreel6_redis_data:
  ztreel6_storage:
  ztreel6_uploads:

networks:
  ztreel6_net:
    driver: bridge

